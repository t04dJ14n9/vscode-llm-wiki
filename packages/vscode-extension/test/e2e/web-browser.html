<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LLM Wiki Browser Test</title>
  <style>
    :root {
      --vscode-editor-background: #1e1e1e;
      --vscode-editor-foreground: #d4d4d4;
      --vscode-sideBar-background: #252526;
      --vscode-panel-border: #3e3e3e;
      --vscode-button-background: #007acc;
      --vscode-button-foreground: #ffffff;
      --vscode-button-secondaryBackground: #3a3d41;
      --vscode-button-secondaryForeground: #cccccc;
      --vscode-editorWidget-background: #252526;
      --vscode-textBlockQuote-background: #252526;
      --vscode-textBlockQuote-border: #616161;
      --vscode-textLink-foreground: #3794ff;
      --vscode-descriptionForeground: #9d9d9d;
      --vscode-editor-selectionBackground: #264f78;
      --vscode-focusBorder: #007fd4;
      --vscode-editorWarning-foreground: #cca700;
      --vscode-inputValidation-warningBackground: #352a05;
      --vscode-inputValidation-warningForeground: #f0d75a;
      --vscode-textCodeBlock-background: #2d2d2d;
    }
    html, body, #app { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.__mockMessages = [];
    window.acquireVsCodeApi = () => ({
      postMessage(message) {
        window.__mockMessages.push(message);
      },
      getState() { return {}; },
      setState() {},
    });
  </script>
  <script src="/dist/experimental-owned-browser.js"></script>
</body>
</html>
