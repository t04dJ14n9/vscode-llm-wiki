<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Learning PDF Viewer Fixture</title>
<style>
  :root {
    --vscode-editor-background: #1e1e1e;
    --vscode-editor-foreground: #d4d4d4;
    --vscode-sideBar-background: #252526;
    --vscode-panel-border: #3e3e3e;
    --vscode-button-secondaryBackground: #3a3d41;
    --vscode-button-secondaryForeground: #cccccc;
    --vscode-button-background: #007acc;
    --vscode-button-foreground: #ffffff;
    --vscode-errorForeground: #f48771;
    --vscode-input-background: #1e1e1e;
    --vscode-input-foreground: #d4d4d4;
    --vscode-focusBorder: #007fd4;
    --vscode-editorWidget-background: #252526;
    --vscode-descriptionForeground: #9d9d9d;
  }
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); }
  #toolbar {
    height: 34px;
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 0 8px;
    border-bottom: 1px solid var(--vscode-panel-border);
    background: var(--vscode-sideBar-background);
  }
  #toolbar button {
    height: 24px;
    border: 1px solid transparent;
    background: var(--vscode-button-secondaryBackground);
    color: var(--vscode-button-secondaryForeground);
    border-radius: 4px;
    cursor: pointer;
  }
  #toolbar button[aria-pressed="true"] {
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
  }
  .pdf-search {
    position: fixed;
    top: 42px;
    right: 8px;
    z-index: 40;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: minmax(128px, 1fr) 24px 24px minmax(44px, max-content) 24px;
    align-items: center;
    gap: 2px;
    width: min(420px, calc(100% - 16px));
    min-height: 34px;
    padding: 4px;
    border: 1px solid var(--vscode-panel-border);
    border-radius: 3px;
    background: var(--vscode-editorWidget-background);
    color: var(--vscode-editor-foreground);
    box-shadow: 0 2px 8px rgba(0,0,0,.36);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
  }
  .pdf-search.hidden { display: none; }
  .pdf-search input {
    box-sizing: border-box;
    width: 100%;
    height: 26px;
    min-width: 0;
    margin: 0;
    padding: 2px 6px;
    border: 1px solid transparent;
    border-radius: 2px;
    outline: 0;
    background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    font: inherit;
  }
  .pdf-search input:focus { border-color: var(--vscode-focusBorder); }
  .pdf-search button {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    min-width: 24px;
    margin: 0;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 3px;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    background-image: none;
    box-shadow: none;
    color: var(--vscode-editor-foreground);
    font: inherit;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
  }
  .pdf-search button:hover { background-color: rgba(90,93,94,.31); }
  .pdf-search button:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .pdf-search .count {
    min-width: 44px;
    padding: 0 4px;
    color: var(--vscode-descriptionForeground);
    text-align: center;
    white-space: nowrap;
  }
  #viewer-container { height: calc(100% - 35px); overflow: auto; }
  #page-container { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 18px; }
  #page-container.two-page { display: grid; grid-template-columns: repeat(2, max-content); align-items: start; justify-content: center; }
  #page-container.paginated { min-height: calc(100% - 36px); justify-content: center; align-content: center; }
  .page-wrapper { position: relative; background: white; box-shadow: 0 2px 12px rgba(0,0,0,.35); }
  .pdf-canvas, .text-layer, .highlight-layer { position: absolute; left: 0; top: 0; }
  .text-layer {
    right: 0;
    bottom: 0;
    user-select: text;
    color: transparent;
    forced-color-adjust: none;
  }
  .text-layer span {
    position: absolute;
    color: transparent;
    -webkit-text-fill-color: transparent;
    white-space: pre;
    cursor: text;
    forced-color-adjust: none;
  }
  .highlight-layer { right: 0; bottom: 0; pointer-events: none; }
  .annotation-highlight { pointer-events: auto; }
  .pdf-search-match {
    position: absolute;
    border-radius: 2px;
    background: rgba(255, 214, 10, .40);
    outline: 1px solid rgba(255, 214, 10, .55);
    pointer-events: none;
  }
  .pdf-search-match.selected {
    background: rgba(255, 140, 0, .45);
    outline-color: rgba(255, 140, 0, .85);
  }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="prev">Prev</button>
    <button id="next">Next</button>
    <button id="zoom-out">-</button>
    <button id="zoom-in">+</button>
    <button id="fit">Fit</button>
    <button id="search-open" title="Find in PDF">Search</button>
    <button id="toggle-continuous" aria-pressed="true" title="Switch to page-turning mode">Continuous</button>
    <button id="toggle-spread" aria-pressed="false" title="Switch to two-page view">One Page</button>
    <span id="page-info"></span>
  </div>
  <div id="pdf-search" class="pdf-search hidden" role="search" aria-label="Find in PDF">
    <input id="pdf-search-input" type="search" placeholder="Find" aria-label="Find in PDF" autocomplete="off">
    <button id="pdf-search-prev" type="button" title="Previous match" aria-label="Previous match">↑</button>
    <button id="pdf-search-next" type="button" title="Next match" aria-label="Next match">↓</button>
    <span id="pdf-search-count" class="count" aria-live="polite"></span>
    <button id="pdf-search-close" type="button" title="Close search" aria-label="Close search">×</button>
  </div>
  <div id="viewer-container"><div id="page-container"></div></div>

  <script>
    window.__mockMessages = [];
    window.__pdfiumWasmUrl = '/dist/pdfium.wasm';
    window.acquireVsCodeApi = () => ({
      postMessage: async (message) => {
        window.__mockMessages.push(message);
        if (message.type !== 'ready') return;

        const fixture = new URLSearchParams(window.location.search).get('fixture') || 'flash-attention';
        const response = await fetch(`/fixtures/${fixture}.pdf`);
        if (!response.ok) throw new Error(`Failed to load fixture PDF: ${response.status}`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        let binary = '';
        for (const byte of bytes) binary += String.fromCharCode(byte);
        window.postMessage({ type: 'loadPdf', data: btoa(binary) }, '*');
      },
      getState: () => ({}),
      setState: () => {},
    });
  </script>
  <script src="/dist/pdf-viewer.js"></script>
</body>
</html>
