name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

  demo-vault:
    name: Validate distributable demo vault
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository, LFS evidence, and Nanochat
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Run demo-vault producer tests
        run: python3 -m unittest discover -s tools/demo-vault/tests -v

      - name: Check deterministic demo-vault indexes
        run: python3 tools/demo-vault/rebuild_indexes.py --vault demo-vault --check

      - name: Validate demo-vault
        run: python3 tools/demo-vault/validate_vault.py --vault demo-vault

      - name: Verify pinned Nanochat submodule
        run: git submodule status -- demo-vault/projects/code/nanochat

  webview-regressions:
    name: Markdown and PDF browser regressions (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: deterministic fuzz
            spec: packages/vscode-extension/test/e2e/markdown-editor-fuzz.spec.ts
          - suite: Vim command fuzz
            spec: packages/vscode-extension/test/e2e/markdown-editor-vim-command-fuzz.spec.ts
          - suite: remaining tests
            spec: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build combined extension
        run: pnpm build:extension

      - name: Run focused browser regression suite
        if: matrix.spec != ''
        run: pnpm exec playwright test --config playwright.config.ts ${{ matrix.spec }}

      - name: Run remaining Markdown and PDF browser regressions
        if: matrix.spec == ''
        run: pnpm exec playwright test --config playwright.config.ts --grep-invert 'LLM Wiki Markdown (deterministic keystroke fuzzing|expanded Vim command fuzzing)'
