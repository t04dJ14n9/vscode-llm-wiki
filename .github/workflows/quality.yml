name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

  demo-vault:
    name: Validate distributable demo vault
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository and LFS evidence
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install PDF skill test dependency
        run: python3 -m pip install 'pdfplumber>=0.11,<0.12'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install producer-test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install demo-vault validation dependency
        run: npm ci --prefix demo-vault

      - name: Run demo-vault producer tests
        run: python3 -m unittest discover -s tools/llm-wiki/tests -v

      - name: Check deterministic demo-vault indexes
        run: python3 demo-vault/tools/llm-wiki/vault.py rebuild --check

      - name: Validate demo-vault
        run: python3 demo-vault/tools/llm-wiki/vault.py validate

  webview-regressions:
    name: Markdown and PDF browser regressions (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: deterministic fuzz
            args: packages/vscode-extension/test/e2e/markdown-editor-fuzz.spec.ts
          - suite: Vim command fuzz
            args: packages/vscode-extension/test/e2e/markdown-editor-vim-command-fuzz.spec.ts
          - suite: Markdown editor 1 of 2
            args: packages/vscode-extension/test/e2e/markdown-editor.spec.ts --fully-parallel --shard=1/2
          - suite: Markdown editor 2 of 2
            args: packages/vscode-extension/test/e2e/markdown-editor.spec.ts --fully-parallel --shard=2/2
          - suite: PDF viewer
            args: packages/vscode-extension/test/e2e/pdf-viewer.spec.ts
          - suite: PDF preview and selection
            args: >-
              packages/vscode-extension/test/e2e/pdf-preview-parity.spec.ts
              packages/vscode-extension/test/e2e/pdf-preview-selection.spec.ts
          - suite: supporting PDF and web
            args: >-
              packages/vscode-extension/test/e2e/embedpdf-headless-spike.spec.ts
              packages/vscode-extension/test/e2e/pdf-internal-links.spec.ts
              packages/vscode-extension/test/e2e/pdf-manual-smoke.spec.ts
              packages/vscode-extension/test/e2e/pdf-page-turn-prefetch.spec.ts
              packages/vscode-extension/test/e2e/pdf-viewer-focus-frame.spec.ts
              packages/vscode-extension/test/e2e/web-browser.spec.ts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build combined extension
        run: pnpm build:extension

      - name: Run browser regression shard
        run: pnpm exec playwright test --config playwright.config.ts ${{ matrix.args }}
